<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Setelan — sso by keroyokan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0b0b'/%3E%3Crect x='8' y='8' width='6' height='6' rx='1.5' fill='%23fff'/%3E%3Crect x='18' y='8' width='6' height='6' rx='1.5' fill='%23fff'/%3E%3Crect x='8' y='18' width='6' height='6' rx='1.5' fill='%23fff'/%3E%3Crect x='18' y='18' width='6' height='6' rx='1.5' fill='%23fff'/%3E%3C/svg%3E">
<script>
try {
  var savedTheme = localStorage.getItem('sso.theme');
  if (savedTheme === 'dark' || (!savedTheme && matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.dataset.theme = 'dark';
  }
} catch (e) {}
</script>
<link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/styles.css">
<style>
  .settings-page {
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 28px 72px;
  }

  .settings-page h1 {
    font-size: 30px;
  }

  .panel {
    margin-top: 22px;
    padding: 20px;
    background: var(--surface);
    border: 0;
    border-radius: var(--r-lg);
  }

  .panel h2 {
    margin: 0 0 8px;
    font-size: 15px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }

  .muted {
    margin: 0 0 16px;
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.55;
  }

  .settings-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .settings-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 12px;
    background: var(--surface-2);
    transition: opacity 0.15s ease, background 0.15s ease;
  }

  .settings-row.dragging {
    opacity: 0.65;
    background: var(--surface);
  }

  .drag-handle {
    flex: none;
    width: 28px;
    height: 32px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--faint);
    cursor: grab;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  .drag-handle:active {
    cursor: grabbing;
  }

  .drag-handle:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .drag-handle svg {
    width: 14px;
    height: 14px;
  }

  .settings-copy {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .settings-name {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .settings-desc {
    font-size: 11.5px;
    color: var(--faint);
  }

  .switch {
    position: relative;
    flex: none;
    width: 38px;
    height: 22px;
  }

  .switch input {
    position: absolute;
    inset: 0;
    z-index: 1;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }

  .switch-track {
    position: relative;
    display: block;
    width: 38px;
    height: 22px;
    border-radius: 999px;
    background: var(--line-strong);
    transition: background 0.18s ease;
  }

  .switch-track::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.18s ease, background 0.18s ease;
  }

  .switch input:checked + .switch-track {
    background: var(--accent);
  }

  .switch input:checked + .switch-track::after {
    background: var(--bg);
    transform: translateX(16px);
  }

  .switch input:focus-visible + .switch-track {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .settings-foot {
    margin-top: 18px;
    display: flex;
    justify-content: flex-end;
  }

  @media (max-width: 520px) {
    .settings-page {
      padding: 36px 20px 56px;
    }
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="/" aria-label="SSO Lite">
      <span class="brand-logo" aria-hidden="true"></span>
    </a>
    <a class="ghost-btn" href="/">Kembali</a>
  </div>
</header>

<main class="settings-page">
  <h1>Setelan</h1>

  <section class="panel">
    <h2>Bagian</h2>
    <p class="muted">Tarik untuk mengubah urutan. Matikan bagian yang tidak mau ditampilkan.</p>
    <ul id="sectionList" class="settings-list"></ul>
  </section>

  <div class="settings-foot">
    <button id="resetBtn" class="btn" type="button">Atur ulang</button>
  </div>
</main>

<script src="/settings.js" defer></script>
</body>
</html>
