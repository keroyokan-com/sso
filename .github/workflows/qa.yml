name: QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:search
      - run: npm run build
      - run: npm run test:qa
        env:
          QA_SCREEN_DIR: ${{ runner.temp }}/sso-qa-screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-screens
          path: ${{ runner.temp }}/sso-qa-screens
          if-no-files-found: ignore
